# Privacy-safe Clash YAML rule scheme for 塔台 / Stash
# Combines ACL4SSR_Happy policy structure with the tested Stash DNS settings.
# No subscription URL, proxy server, UUID, password or token is included.

name: ACL4SSR Happy + Stash DNS
desc: 保留原 ACL4SSR_Happy 分流与策略组，并加入 Stash Fake-IP / 国内 DNS / iOS 系统 DNS 兼容配置

mode: rule
log-level: warning
ipv6: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://dns.alidns.com/dns-query
    - system

  nameserver-policy:
    "+.apple.com": system
    "+.apple.com.cn": system
    "+.icloud.com": system
    "+.icloud.com.cn": system
    "+.icloud-content.com": system
    "+.mzstatic.com": system
    "+.aaplimg.com": system
    "+.cdn-apple.com": system
    "+.weather.com": system
    "+.local": system
    "+.lan": system

  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.icloud.com"
    - "+.icloud.com.cn"
    - "+.icloud-content.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    proxies:
      - "♻️ 自动选择"
      - DIRECT
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇸🇬 狮城节点"
      - "🇨🇳 台湾节点"
      - "🇰🇷 韩国节点"

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇭🇰 香港节点"
    type: url-test
    include-all: true
    filter: "(?i)(香港|HK|Hong Kong|HongKong)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇯🇵 日本节点"
    type: url-test
    include-all: true
    filter: "(?i)(日本|JP|Japan)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    filter: "(?i)(美国|US|USA|United States|Los Angeles|San Jose)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇸🇬 狮城节点"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|SG|Singapore)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇨🇳 台湾节点"
    type: url-test
    include-all: true
    filter: "(?i)(台湾|TW|Taiwan)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇰🇷 韩国节点"
    type: url-test
    include-all: true
    filter: "(?i)(韩国|KR|Korea)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇲🇾 Claude"
    type: select
    include-all: true
    filter: "(?i)(马来西亚|Malaysia)"

  - name: "🤖 OpenAI"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 狮城节点"
      - "🇨🇳 台湾节点"
      - "🇰🇷 韩国节点"
      - "🚀 节点选择"

  - name: "🔷 Google Gemini"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 狮城节点"
      - "🇨🇳 台湾节点"
      - "🇰🇷 韩国节点"
      - "🚀 节点选择"

  - name: "🔎 Google"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 狮城节点"
      - "🇨🇳 台湾节点"
      - "🇰🇷 韩国节点"
      - "🚀 节点选择"

  - name: "📹 YouTube"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 狮城节点"
      - "🇨🇳 台湾节点"
      - "🇰🇷 韩国节点"
      - "🚀 节点选择"

  - name: "🌍 国外媒体"
    type: select
    proxies:
      - "🚀 节点选择"

  - name: "📲 电报信息"
    type: select
    proxies:
      - "🚀 节点选择"

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - "🎯 全球直连"
      - "🚀 节点选择"

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT

  - name: "🛑 全球拦截"
    type: select
    proxies:
      - REJECT

  - name: "🍃 应用净化"
    type: select
    proxies:
      - REJECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"

