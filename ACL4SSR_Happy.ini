[custom]
; Privacy-safe rule template for 塔台 / subconverter / Stash
; Contains no subscription URL, proxy server, UUID, password or token.

; ===== Direct =====
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; ===== Ad blocking =====
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; ===== Google / Microsoft / Apple / Telegram =====
ruleset=🔎 Google,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; ===== AI =====
; Put Claude rules before generic proxy/media rules so they hit the Malaysia group first.
ruleset=🇲🇾 Claude,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🇲🇾 Claude,[]DOMAIN-SUFFIX,claude.ai
ruleset=🇲🇾 Claude,[]DOMAIN-SUFFIX,claude.com
ruleset=🇲🇾 Claude,[]DOMAIN-SUFFIX,claudeusercontent.com

ruleset=🤖 OpenAI,[]DOMAIN-KEYWORD,openai
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,sora.com

ruleset=🔷 Google Gemini,[]DOMAIN,ai.google.dev
ruleset=🔷 Google Gemini,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🔷 Google Gemini,[]DOMAIN-SUFFIX,generativeai.google
ruleset=🔷 Google Gemini,[]DOMAIN-KEYWORD,generativelanguage

ruleset=📹 YouTube,[]DOMAIN-KEYWORD,youtube
ruleset=📹 YouTube,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=📹 YouTube,[]DOMAIN-SUFFIX,youtu.be
ruleset=📹 YouTube,[]DOMAIN-SUFFIX,youtube.com
ruleset=📹 YouTube,[]DOMAIN-SUFFIX,ytimg.com

; ===== Media / proxy / China =====
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ===== Proxy groups =====
; Keep the original strategy groups AND append every individual proxy via the final .*
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; Country groups
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|HK|Hong Kong|HongKong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|US|USA|United States|Los Angeles|San Jose)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`(台湾|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(韩国|KR|Korea)`http://www.gstatic.com/generate_204`300,,50

; Claude: only actual nodes whose names contain 马来西亚 / Malaysia
custom_proxy_group=🇲🇾 Claude`select`(马来西亚|Malaysia)

; Service groups
custom_proxy_group=🤖 OpenAI`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`[]🚀 节点选择
custom_proxy_group=🔷 Google Gemini`select`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`[]🚀 节点选择
custom_proxy_group=🔎 Google`select`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`[]🚀 节点选择
custom_proxy_group=📹 YouTube`select`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`[]🚀 节点选择
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]🎯 全球直连
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT
custom_proxy_group=🍃 应用净化`select`[]REJECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连

enable_rule_generator=true
overwrite_original_rules=true
